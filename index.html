<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avionics System Designer</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --primary: #f39c12;
            --primary-hover: #e67e22;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --danger: #e74c3c;
            --success: #2ecc71;
            --border: #333333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

        /* Setup Overlay */
        #setupOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 1000;
            display: flex; align-items: center; justify-content: center;
        }
        .setup-box { background: var(--bg-panel); padding: 30px; border-radius: 8px; width: 400px; border: 1px solid var(--border); }
        .setup-box h2 { color: var(--primary); margin-bottom: 10px; }
        .setup-box p { color: var(--text-muted); margin-bottom: 20px; font-size: 0.9em; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9em; }
        .form-group select, .form-group input { width: 100%; padding: 10px; background: #2a2a2a; color: white; border: 1px solid var(--border); border-radius: 4px; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn:hover { background: var(--primary-hover); }

        /* Main App Layout */
        header { background: var(--bg-panel); padding: 15px 20px; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center;}
        header h1 { font-size: 1.4em; }
        
        #appContainer { display: none; flex: 1; flex-direction: row; overflow: hidden; }
        
        /* Sidebar Navigation */
        .nav-sidebar { width: 220px; background: var(--bg-panel); border-right: 1px solid var(--border); overflow-y: auto; }
        .nav-sidebar ul { list-style: none; }
        .nav-sidebar li { padding: 15px 20px; cursor: pointer; border-bottom: 1px solid var(--border); transition: 0.2s; }
        .nav-sidebar li:hover { background: #2a2a2a; }
        .nav-sidebar li.active { border-left: 4px solid var(--primary); background: #2a2a2a; font-weight: bold; }

        /* Main Content Grid */
        .main-content { flex: 1; padding: 20px; overflow-y: auto; }
        .category-title { margin-bottom: 20px; color: var(--primary); border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        
        /* Product Card */
        .card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 6px; padding: 15px; display: flex; flex-direction: column; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .card-title { font-size: 1.1em; font-weight: bold; }
        .vendor-link { font-size: 0.8em; color: var(--primary); text-decoration: none; }
        .vendor-link:hover { text-decoration: underline; }
        .card-price { font-size: 1.3em; color: var(--success); font-weight: bold; margin-bottom: 10px; }
        .card-specs { background: #121212; padding: 10px; border-radius: 4px; font-size: 0.85em; margin-bottom: 15px; flex: 1;}
        .card-specs span { display: block; margin-bottom: 5px; color: var(--text-muted); }
        .card-specs strong { color: white; }
        .card-actions { display: flex; gap: 10px; }
        .qty-input { width: 60px; background: #121212; color: white; border: 1px solid var(--border); text-align: center; border-radius: 4px;}
        .btn-add { flex: 1; }

        /* Build Summary Sidebar */
        .build-sidebar { width: 320px; background: var(--bg-panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .build-header { padding: 15px; border-bottom: 1px solid var(--border); }
        .build-list { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .build-item { background: #121212; padding: 10px; border-radius: 4px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .build-item-info { font-size: 0.85em; }
        .btn-remove { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 5px 8px; cursor: pointer; border-radius: 4px; }
        .btn-remove:hover { background: var(--danger); color: white; }
        
        .build-totals { padding: 20px; background: #181818; border-top: 1px solid var(--border); }
        .totals-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 0.9em;}
        .totals-row strong { color: white; }
        .cost-total { font-size: 1.4em; color: var(--success); font-weight: bold; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 10px;}
    </style>
</head>
<body>

    <!-- Initial Setup Modal -->
    <div id="setupOverlay">
        <div class="setup-box">
            <h2>Avionics System Designer</h2>
            <p>Configure your initial parameters to get started.</p>
            <div class="form-group">
                <label>Vehicle Type</label>
                <select id="vehicleType">
                    <option>FPV Freestyle Drone</option>
                    <option>FPV Racing Drone</option>
                    <option>Fixed Wing / Plane</option>
                    <option>Cinematic Lifter</option>
                </select>
            </div>
            <div class="form-group">
                <label>Target Weight Limit (grams)</label>
                <input type="number" id="targetWeight" value="650" />
            </div>
            <button class="btn" onclick="startApp()">Start Building</button>
        </div>
    </div>

    <header>
        <h1>Avionics System Designer</h1>
        <div id="header-vehicle-info" style="color: var(--primary);"></div>
    </header>

    <div id="appContainer">
        <!-- Categories -->
        <nav class="nav-sidebar">
            <ul id="categoryList"></ul>
        </nav>

        <!-- Product Selection -->
        <main class="main-content">
            <h2 id="currentCategoryTitle" class="category-title">Select Category</h2>
            <div id="productsGrid" class="products-grid"></div>
        </main>

        <!-- Current Build Data -->
        <aside class="build-sidebar">
            <div class="build-header">
                <h2>Your Build</h2>
            </div>
            <div class="build-list" id="buildList">
                <!-- Selected items render here -->
            </div>
            <div class="build-totals">
                <div class="totals-row">
                    <span>Target Weight:</span>
                    <strong id="displayTargetWeight">0g</strong>
                </div>
                <div class="totals-row">
                    <span>Est. Weight:</span>
                    <strong id="totalWeight">0g</strong>
                </div>
                <div class="totals-row">
                    <span>Power System Config:</span>
                    <strong id="powerSystem" style="color: var(--primary); text-align: right; max-width: 160px;">N/A</strong>
                </div>
                <div class="totals-row cost-total">
                    <span>Total Cost:</span>
                    <span id="totalCost">$0.00</span>
                </div>
            </div>
        </aside>
    </div>

    <script>
        // Default Database - Used if the GitHub scraper action hasn't created data.json yet
        const defaultData = {
            categories: ["Flight Controller", "ESC", "Motors", "Receiver", "VTX", "Camera", "Battery", "Servos", "Accessories"],
            parts: [
                { id: "fc_speedybee", category: "Flight Controller", name: "SpeedyBee F405 V4 30x30", vendor: "GetFPV", link: "https://www.getfpv.com/speedybee-f405-v4-flight-controller-30x30.html", price: 39.99, weight: 8.6, power: "3-6S LiPo", specifics: { "MCU": "STM32F405", "Gyro": "ICM42688P", "Mounting": "30.5mm" } },
                { id: "esc_speedybee", category: "ESC", name: "SpeedyBee BLS 50A 4-in-1", vendor: "GetFPV", link: "https://www.getfpv.com/speedybee-bls-50a-30x30-4-in-1-esc.html", price: 45.99, weight: 13.8, power: "3-6S LiPo, 50A Cont.", specifics: { "Firmware": "BLHeli_S", "Protocol": "DSHOT600" } },
                { id: "motor_emax", category: "Motors", name: "EMAX ECO II 2207", vendor: "GetFPV", link: "https://www.getfpv.com/emax-eco-ii-series-2207-motor-1700kv-1900kv-2400kv.html", price: 16.99, weight: 33.4, power: "3-6S LiPo", specifics: { "KV": "1700/1900/2400", "Stator": "2207", "Max Current": "~45A" } },
                { id: "rx_tbs", category: "Receiver", name: "TBS Crossfire Nano Rx", vendor: "GetFPV", link: "https://www.getfpv.com/tbs-crossfire-nano-rx.html", price: 38.99, weight: 0.5, power: "5V DC", specifics: { "Freq": "915MHz", "Protocol": "CRSF" } },
                { id: "batt_tattu", category: "Battery", name: "Tattu R-Line V5.0 1200mAh 6S", vendor: "GetFPV", link: "https://www.getfpv.com/tattu-r-line-version-5-0-1200mah-6s1p-150c-lipo-battery.html", price: 35.99, weight: 197, power: "22.2V (6S)", specifics: { "Capacity": "1200mAh", "Discharge": "150C" } },
                { id: "vtx_o3", category: "VTX", name: "DJI O3 Air Unit", vendor: "GetFPV", link: "https://www.getfpv.com/dji-o3-air-unit.html", price: 229.00, weight: 36.4, power: "7.4-26.4V", specifics: { "Freq": "5.8GHz", "Storage": "20GB" } },
                { id: "cam_phoenix", category: "Camera", name: "RunCam Phoenix 2", vendor: "GetFPV", link: "https://www.getfpv.com/runcam-phoenix-2-joshua-bardwell-edition-cmos-micro-fpv-camera.html", price: 29.99, weight: 9.0, power: "5-36V", specifics: { "Sensor": "1/2 inch CMOS", "Res": "1000TVL" } },
                { id: "servo_emax", category: "Servos", name: "EMAX ES08MA II Analog", vendor: "GetFPV", link: "https://www.getfpv.com/emax-es08ma-ii-12g-mini-metal-gear-analog-servo.html", price: 8.99, weight: 12.0, power: "4.8-6.0V", specifics: { "Gears": "Metal", "Speed": "0.12 sec/60°" } },
                { id: "acc_hqprop", category: "Accessories", name: "HQProp 5X4.3X3 (Set of 4)", vendor: "GetFPV", link: "https://www.getfpv.com/hqprop-5x4-3x3-v2s-light-grey-propeller-set-of-4.html", price: 3.19, weight: 15.2, power: "N/A", specifics: { "Size": "5 inch", "Pitch": "4.3", "Blades": "3" } }
            ]
        };

        let partsDatabase = [];
        let categories = [];
        let currentBuild = [];
        let selectedCategory = "";

        // 1. App Initialization
        async function startApp() {
            const vehicle = document.getElementById('vehicleType').value;
            const targetWeight = document.getElementById('targetWeight').value;
            
            document.getElementById('header-vehicle-info').innerText = `${vehicle} | Target: ${targetWeight}g`;
            document.getElementById('displayTargetWeight').innerText = `${targetWeight}g`;
            document.getElementById('setupOverlay').style.display = 'none';
            document.getElementById('appContainer').style.display = 'flex';

            await loadData();
        }

        // 2. Fetch live data (Allows GitHub Actions to inject updated prices via data.json)
        async function loadData() {
            try {
                const response = await fetch('data.json');
                if(response.ok) {
                    const data = await response.json();
                    partsDatabase = data.parts;
                    categories = data.categories;
                } else { throw new Error("Local JSON not found"); }
            } catch(e) {
                console.log("Loading fallback default data. (Deploy the Python Scraper to update prices!)");
                partsDatabase = defaultData.parts;
                categories = defaultData.categories;
            }
            renderCategories();
            if(categories.length > 0) selectCategory(categories[0]);
        }

        // 3. UI Rendering logic
        function renderCategories() {
            const list = document.getElementById('categoryList');
            list.innerHTML = "";
            categories.forEach(cat => {
                const li = document.createElement('li');
                li.innerText = cat;
                li.onclick = () => selectCategory(cat);
                li.id = `cat-${cat.replace(/\s+/g, '')}`;
                list.appendChild(li);
            });
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.nav-sidebar li').forEach(el => el.classList.remove('active'));
            document.getElementById(`cat-${cat.replace(/\s+/g, '')}`).classList.add('active');
            document.getElementById('currentCategoryTitle').innerText = cat;
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = "";
            const filtered = partsDatabase.filter(p => p.category === selectedCategory);
            
            filtered.forEach(part => {
                let specHtml = `<span><strong>Weight:</strong> ${part.weight}g</span>
                                <span><strong>Power:</strong> ${part.power}</span><hr style="border-color:#333; margin:8px 0;">`;
                for (const [key, val] of Object.entries(part.specifics)) {
                    specHtml += `<span><strong>${key}:</strong> ${val}</span>`;
                }

                grid.innerHTML += `
                    <div class="card">
                        <div class="card-header">
                            <span class="card-title">${part.name}</span>
                        </div>
                        <div class="card-price">$${part.price.toFixed(2)}</div>
                        <div class="card-specs">${specHtml}</div>
                        <div class="card-actions">
                            <input type="number" id="qty-${part.id}" class="qty-input" value="1" min="1">
                            <button class="btn btn-add" onclick="addPart('${part.id}')">Add</button>
                            <a href="${part.link}" target="_blank" class="btn" style="text-align:center; background:#333; text-decoration:none; width:auto; padding:12px 15px;">Vendor</a>
                        </div>
                    </div>`;
            });
        }

        // 4. Build Management
        function addPart(partId) {
            const qty = parseInt(document.getElementById(`qty-${partId}`).value) || 1;
            const part = partsDatabase.find(p => p.id === partId);
            const existing = currentBuild.find(item => item.part.id === partId);
            
            if(existing) existing.qty += qty;
            else currentBuild.push({ part, qty, id: Date.now() });
            
            renderBuild();
        }

        function removePart(buildId) {
            currentBuild = currentBuild.filter(item => item.id !== buildId);
            renderBuild();
        }

        function renderBuild() {
            const list = document.getElementById('buildList');
            list.innerHTML = "";
            
            let tCost = 0, tWeight = 0;
            let pwrSystems = new Set();

            currentBuild.forEach(item => {
                const subCost = item.part.price * item.qty;
                const subWeight = item.part.weight * item.qty;
                tCost += subCost; tWeight += subWeight;
                if(item.part.power && item.part.power !== "N/A") pwrSystems.add(item.part.power);

                list.innerHTML += `
                    <div class="build-item">
                        <div class="build-item-info">
                            <strong>${item.part.name}</strong> (x${item.qty})<br>
                            <span style="color:var(--success)">$${subCost.toFixed(2)}</span> | <span style="color:var(--text-muted)">${subWeight.toFixed(1)}g</span>
                        </div>
                        <button class="btn-remove" onclick="removePart(${item.id})">X</button>
                    </div>`;
            });

            // Update Totals & check weight configs
            document.getElementById('totalCost').innerText = `$${tCost.toFixed(2)}`;
            const wEl = document.getElementById('totalWeight');
            wEl.innerText = `${tWeight.toFixed(1)}g`;
            const maxW = parseFloat(document.getElementById('targetWeight').value);
            
            wEl.style.color = (tWeight > maxW) ? "var(--danger)" : "var(--text-main)";
            document.getElementById('powerSystem').innerText = pwrSystems.size > 0 ? Array.from(pwrSystems).join(', ') : "N/A";
        }
    </script>
</body>
</html>
